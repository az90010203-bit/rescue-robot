[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D SERIAL_BAUD=115200
  -D SERVO_BUS_BAUD=1000000
  -D SERVO_UART_RX=18
  -D SERVO_UART_TX=19
  -D SERVO_DIR_PIN=-1
build_src_filter =
  +<*>
  -<tb6618_main.cpp>
lib_deps =
  bblanchon/ArduinoJson@^7.3.0

[env:uno_tb6618]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
  -D SERIAL_BAUD=115200
build_src_filter =
  +<tb6618_main.cpp>
lib_deps =
  bblanchon/ArduinoJson@^7.3.0
